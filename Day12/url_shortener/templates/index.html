<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
            width:450px;
        }

        input{
            width:100%;
            padding:10px;
            margin:15px 0;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            background:#1976d2;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            font-size:18px;
        }

        a{
            color:#1976d2;
        }
    </style>

</head>

<body>

<div class="container">

<h2>URL Shortener</h2>

<input
id="url"
type="url"
placeholder="Enter URL">

<button onclick="shortenURL()">

Shorten

</button>

<div id="result"></div>

</div>

<script>

async function shortenURL(){

    const url=document.getElementById("url").value;

    const response=await fetch("/shorten",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            url:url
        })

    });

    const data=await response.json();

    if(response.ok){

        const shortLink=
            window.location.origin+"/"+data.short_code;

        document.getElementById("result").innerHTML=

        `
        <p><b>Short URL</b></p>

        <a href="${shortLink}" target="_blank">

        ${shortLink}

        </a>
        `;

    }

    else{

        document.getElementById("result").innerHTML=

        JSON.stringify(data);

    }

}

</script>

</body>
</html>
