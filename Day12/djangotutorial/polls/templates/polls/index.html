{% load static %}
<link rel="stylesheet" href="{% static 'polls/style.css' %}">

{% if latest_ques_list %}
    <ul>
    {% for question in latest_ques_list %}
        <li><h1><a href="{% url 'polls:detail' question.id %}">{{ question.question_text }}</a></h1></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No polls are available.</p>
{% endif %}
